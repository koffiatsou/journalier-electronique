name: Deploy Journalier to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lot S : la V2 est la version définitive, à l'adresse principale ; la V75 reste en secours dans /v75/.
      # La V75 doit donc être compilée pour vivre dans /v75/ (Vite écrit cette base dans ses adresses).
      - name: Build Vite (V75, pour /v75/)
        run: npm run build -- --base=/journalier-electronique/v75/

      - name: Vérifier et compiler la V2 (React + TypeScript)
        working-directory: v2
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Assembler le site (V2 à la racine, V75 dans /v75/) et vérifier toutes les adresses
        working-directory: v2
        run: npm run site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload build
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
