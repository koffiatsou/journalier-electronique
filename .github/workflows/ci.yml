name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Même compilation que la mise en ligne (lot S) : la V75 vit dans /v75/, la V2 est à l'adresse principale.
      - name: Build (V75, pour /v75/)
        run: npm run build -- --base=/journalier-electronique/v75/

      - name: V2 — typecheck, tests et build
        working-directory: v2
        run: |
          npm install --no-audit --no-fund
          npm run check

      # Vérifie ici, avant toute fusion, ce qui serait publié : chaque page appelle des fichiers qui existent, de sa propre version.
      - name: Assembler le site (V2 à la racine, V75 dans /v75/) et vérifier toutes les adresses
        working-directory: v2
        run: npm run site

      # Parcours dans un vrai navigateur (lot Q) : l'accessibilité, l'agenda, la séance, le PIA, la synchronisation…
      # Playwright est un outil de vérification : installé ici seulement, sans toucher à v2/package.json ni aux dépendances de l'application.
      - name: V2 — installer l'outil de test Playwright (hors package.json)
        working-directory: v2
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: V2 — parcours dans un vrai navigateur
        working-directory: v2
        run: npm run navigateur
